# Orquestacion de la plataforma.
#
#   docker compose up -d --build                  -> postgres + backend + frontend
#   docker compose --profile etl run --rm etl     -> ejecuta el ETL y termina
#   docker compose --profile chat up -d ollama    -> Ollama (fase 6, opcional)
#
# Tres imagenes: PostgreSQL (oficial), backend y frontend. El servicio `etl`
# reutiliza la imagen del backend cambiando el entrypoint, porque comparte con
# la API el catalogo, el esquema y la logica de analisis. Vive en un profile
# porque es un job por lotes y no debe arrancar con `up`.

name: futbol-analytics

services:
  postgres:
    image: postgres:16-alpine
    container_name: futbol-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-futbol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-futbol}
      POSTGRES_DB: ${POSTGRES_DB:-futbol}
    ports:
      # Expuesto al host para poder inspeccionar los datos con un cliente SQL.
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-futbol} -d ${POSTGRES_DB:-futbol}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    # Nombre fijo para que el servicio `etl` reutilice esta misma imagen en
    # lugar de construirla dos veces.
    image: futbol-analytics-backend:latest
    container_name: futbol-backend
    restart: unless-stopped
    env_file:
      # No falla si aun no existe .env: los valores por defecto de config.py bastan.
      - path: .env
        required: false
    environment:
      # Dentro de la red de Docker la base de datos se llama "postgres".
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      postgres:
        condition: service_healthy
    # --reload aprovecha el volumen montado: editar src/ recarga la API.
    command:
      - uvicorn
      - futbol_analytics.api.main:app
      - --host=0.0.0.0
      - --port=8000
      - --reload
      - --reload-dir=/app/src

  frontend:
    build:
      context: ./frontend
    image: futbol-analytics-frontend:latest
    container_name: futbol-frontend
    restart: unless-stopped
    environment:
      # La interfaz habla SIEMPRE con la API, nunca con PostgreSQL.
      API_BASE_URL: http://backend:8000
    ports:
      - "${APP_HOST_PORT:-8501}:8501"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      backend:
        condition: service_healthy

  etl:
    # Misma imagen que el backend: solo cambia como se arranca.
    image: futbol-analytics-backend:latest
    build:
      context: ./backend
    container_name: futbol-etl
    profiles: ["etl"]
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      # Cache de soccerdata sobre el volumen ./data, para no re-scrapear FBref.
      SOCCERDATA_DIR: /app/data/soccerdata
    volumes:
      - ./backend/src:/app/src
      # Cache de scraping y ficheros intermedios, fuera de Git.
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    # Con entrypoint, `docker compose run --rm etl --seasons 2627` anade
    # argumentos a la CLI del ETL en lugar de reemplazar el comando entero.
    entrypoint: ["python", "-m", "futbol_analytics.etl"]
    command: []

  scheduler:
    # Misma imagen que el backend: solo cambia como se arranca. No es un cron
    # del sistema sino un proceso Python, porque la imagen no trae cron, corre
    # como usuario sin privilegios, y cron ni escribe en stdout ni hereda el
    # entorno del contenedor.
    image: futbol-analytics-backend:latest
    build:
      context: ./backend
    container_name: futbol-scheduler
    profiles: ["scheduler"]
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      SOCCERDATA_DIR: /app/data/soccerdata
    volumes:
      - ./backend/src:/app/src
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "futbol_analytics.etl.scheduler"]

  ollama:
    image: ollama/ollama:latest
    container_name: futbol-ollama
    profiles: ["chat"]
    restart: unless-stopped
    ports:
      - "${OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      # Los modelos son pesados y no van a Git: viven en un volumen Docker.
      - ollama-models:/root/.ollama

volumes:
  pgdata:
  ollama-models:
