[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "futbol-analytics-backend"
version = "0.1.0"
description = "ETL, analisis y API de la plataforma de analitica de futbol"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Dependencias comunes a todos los servicios: configuracion y validacion.
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
# Calculo puro: percentiles y clustering. Se testea sin base de datos.
analysis = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "scipy>=1.13",
]
# Extraccion (FBref/Understat) y carga en PostgreSQL.
etl = [
    "soccerdata>=1.8",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    # Cruce de nombres entre fuentes. Su `token_sort_ratio` aguanta bien el
    # orden distinto de nombre y apellidos, que es el caso habitual.
    "rapidfuzz>=3.9",
]
# Planificacion de la carga. Aparte del extra "etl" para que los tests del
# planificador se puedan ejecutar sin instalar soccerdata, que arrastra el
# scraping entero.
scheduler = [
    "apscheduler>=3.10",
    # zoneinfo necesita la base de datos de zonas horarias, que la imagen slim
    # no incluye. El paquete la aporta sin depender del sistema.
    "tzdata>=2024.1",
]
# Capa de servicio.
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[tool.hatch.build.targets.wheel]
packages = ["src/futbol_analytics"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplificaciones
    "T20", # prohibe print(): las trazas van por logging
]

[tool.ruff.lint.per-file-ignores]
# Los tests si pueden escribir a stdout.
"tests/*" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
