name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint y tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # El backend no instala el extra "etl": soccerdata arrastra el
          # scraping y los tests no tocan la red. Que su imagen construye se
          # comprueba en el job "docker".
          - project: backend
            extras: "[analysis,api,scheduler,dev]"
          - project: frontend
            extras: "[dev]"
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ${{ matrix.project }}/pyproject.toml

      - name: Instalar dependencias
        run: python -m pip install -e ".${{ matrix.extras }}"

      - name: Ruff (lint)
        run: python -m ruff check --output-format=github .

      - name: Ruff (formato)
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest --cov --cov-report=term-missing

  frontera:
    name: El frontend no importa el backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # La regla de arquitectura que sostiene el proyecto: la interfaz solo
      # habla HTTP con la API. Un import accidental la romperia en silencio y
      # solo se notaria al construir la imagen, que no instala el backend.
      - name: Buscar imports del backend en el frontend
        run: |
          if grep -rn "futbol_analytics" frontend/; then
            echo "::error::El frontend importa el backend. Debe consumir la API por HTTP."
            exit 1
          fi
          echo "Frontera respetada."

  docker:
    name: Construccion de imagenes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Solo se construyen: no se ejecutan ni se publican. Sirve para detectar
      # un Dockerfile que solo funciona por lo que ya hay en cache en la maquina
      # de quien lo escribio: aqui se construye siempre desde cero.
      - name: Construir imagen ${{ matrix.project }}
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.project }}
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.project }}
          cache-to: type=gha,mode=max,scope=${{ matrix.project }}
